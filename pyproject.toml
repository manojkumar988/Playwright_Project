[project]
name = "autonomous-qa-platform"
version = "0.1.0"
description = "Phase 1 autonomous website testing foundation"
requires-python = ">=3.11"
dependencies = [
  "playwright>=1.46.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "sqlalchemy>=2.0.0",
  "psycopg[binary]>=3.2.0",
  "python-dotenv>=1.0.0",
]

[project.scripts]
autonomous-qa = "qa_platform.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
